# OPRO Cronjob Monitor — Complete Technical Documentation

> **Ashley Furniture Industries** | React + TypeScript SPA
> Last updated: April 2026

## 1. Application Overview

The **OPRO Cronjob Monitor** is a single-page React application (SPA) built for Ashley Furniture Industries to monitor the execution of OPRO batch cronjobs. Each batch job runs a six-step pipeline that processes furniture orders, allocates inventory, and generates CODIS suggestions.

### What the app does

| Screen | Route | Purpose |
|--------|-------|---------|
| Batch List | `/` | View all batch executions in a paginated, filterable table |
| Batch Details | `/batch/:batchId` | Drill into a single batch — see metrics, step timings, errors |

### High-level data flow

```
User opens browser
    → React Router loads the correct Page component
        → Page calls a custom hook (useBatches / useBatchDetails)
            → Hook calls React Query → fetchBatches / fetchBatchById (batchApi.ts)
                → batchApi applies filters to MOCK_BATCHES and returns paginated data
                    → Hook returns { data, isLoading, isError }
                        → Page passes data down to display components
                            → User sees the rendered table or detail view
```

### Technology stack

| Tool | Version | Role |
|------|---------|------|
| React 18 | 18.3+ | UI rendering with concurrent features |
| TypeScript 5 | 5.x | Full static type safety |
| Vite 5 | 5.x | Dev server and optimised production builds |
| Material UI v7 | 7.3+ | Component library, Ashley brand theme |
| React Router v7 | 7.x | Client-side routing, URL-persisted filters |
| TanStack React Query v5 | 5.x | Server state, caching, loading/error states |
| date-fns v3 | 3.x | Date formatting and parsing |
| Axios v1 | 1.x | HTTP client (wired, mock data currently used) |

## 3. Bootstrap Layer

### `src/main.tsx` — DOM Mount Point

```typescript
const rootElement = document.getElementById('root');
if (!rootElement) throw new Error('Root element not found.');
createRoot(rootElement).render(
  <StrictMode><App /></StrictMode>
);
```

**What happens here:**
`createRoot` (React 18 concurrent API) mounts the app onto `<div id="root">` in `index.html`. `StrictMode` wraps the whole tree, causing every component to render **twice in development** — this deliberately surfaces side-effects and deprecated API usage early. It has zero impact in production builds.

---

### `src/App.tsx` — Provider Tree & Router

```typescript
const App: React.FC = () => (
  <ErrorBoundary>
    <QueryClientProvider client={queryClient}>
      <ThemeProvider theme={ashleyTheme}>
        <CssBaseline />
        <FilterProvider>
          <BrowserRouter>
            <Suspense fallback={<LoadingSpinner fullHeight message="Loading page…" />}>
              <Routes>
                <Route path="/"              element={<BatchListPage />} />
                <Route path="/batch/:batchId" element={<BatchDetailsPage />} />
              </Routes>
            </Suspense>
          </BrowserRouter>
        </FilterProvider>
      </ThemeProvider>
    </QueryClientProvider>
  </ErrorBoundary>
);
```

**Provider order — outer to inner (intentional):**

| Layer | Provider | Why this position |
|-------|----------|-------------------|
| 1 | `ErrorBoundary` | Must be outermost — catches errors thrown by any child including other providers |
| 2 | `QueryClientProvider` | React Query wraps all data-fetching hooks; sits outside theme |
| 3 | `ThemeProvider` + `CssBaseline` | MUI styling cascades down; CssBaseline injects CSS reset |
| 4 | `FilterProvider` | Custom context; must be inside Router to access URL params if needed |
| 5 | `BrowserRouter` | Wraps all Route declarations and navigation hooks |
| 6 | `Suspense` | Catches the lazy-load promise; shows LoadingSpinner while page chunk downloads |

**Pages are lazy-loaded:**

```typescript
const BatchListPage    = lazy(() => import('./pages/BatchListPage'));
const BatchDetailsPage = lazy(() => import('./pages/BatchDetailsPage'));
```

This splits the bundle into separate JS chunks. On first visit to `/`, the `BatchDetailsPage` chunk is **never downloaded** — faster initial load. The `Suspense` boundary shows a spinner during the brief download period.

**QueryClient configuration:**

```typescript
const queryClient = new QueryClient({
  defaultOptions: { queries: { refetchOnWindowFocus: false, retry: 2 } },
});
```

- `refetchOnWindowFocus: false` — prevents surprising refetches when the user alt-tabs
- `retry: 2` — on failure, React Query retries the fetch twice before showing an error state

## 4. Data Layer

### 4.1 TypeScript Types — `src/types/batch.ts`

This is the **single source of truth** for every data shape. Nothing is typed inline in components.

#### `BatchStepResult` — one pipeline step

```typescript
export interface BatchStepResult {
  step_name: string;         // e.g. "EDW Fetch"
  started_at: Date;          // Step start timestamp
  completed_at: Date;        // Step end timestamp
  duration_seconds: number;  // Pre-computed (completed - started)
  records_processed: number; // How many records this step touched
  success: boolean;          // Did this step complete without error?
  error_message?: string;    // Populated only on failure
}
```

#### `BatchResult` — a full batch execution

```typescript
export interface BatchResult {
  batch_id: string;               // Format: "BATCH-YYYYMMDD-HHMM"
  started_at: Date;
  completed_at: Date;
  success: boolean;               // true only if ALL 6 steps succeeded
  total_orders: number;           // Random 800–1200
  orders_allocated: number;       // 85–95% of total_orders
  suggestions_generated: number;  // 40–50% of total_orders
  total_duration_seconds: number; // Sum of all step durations
  // The 6 pipeline steps as typed fields (not a generic array):
  edw_fetch: BatchStepResult;
  pass1_allocation: BatchStepResult;
  consolidation: BatchStepResult;
  pass2_allocation: BatchStepResult;
  edd_comparison: BatchStepResult;
  codis_suggestions: BatchStepResult;
}
```

> **Why individual step fields instead of `steps: BatchStepResult[]`?**
> TypeScript can enforce that all 6 steps are always present. An array would allow 0–N steps and require runtime length checks everywhere. With named fields, a missing step is a compile error.

#### `FilterState` — everything the user can filter by

```typescript
export interface FilterState {
  jobId: string;                                         // Partial batch ID search
  date: string | null;                                   // "YYYY-MM-DD" ISO date
  timeFrame: 'all' | 'morning' | 'afternoon' | 'custom';
  customTimeStart: string;                               // "HH:mm" when custom
  customTimeEnd: string;                                 // "HH:mm" when custom
  status: 'all' | 'success' | 'failed';
}
```

#### Constants exported from this file

```typescript
export const DEFAULT_FILTER_STATE: FilterState   // All filters reset to defaults
export const TIME_FRAME_OPTIONS                  // Used by the Select dropdown
export const STEP_KEYS                           // ['edw_fetch', 'pass1_allocation', ...]
export const STEP_LABELS                         // { edw_fetch: 'EDW Fetch', ... }
export const STEP_NUMBERS                        // ['①','②','③','④','⑤','⑥']
```

`STEP_KEYS` is typed as `(keyof Pick<BatchResult, ...>)[]` — iterating it in `ExecutionTimeline` and doing `batch[key]` is **fully type-safe**. TypeScript will error at compile time if a key is wrong.

### 4.2 Mock Data — `src/services/mockData.ts`

#### Deterministic seeded random number generator

```typescript
const seededRand = (seed: number): (() => number) => {
  let s = seed;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;  // Always returns a float in [0, 1)
  };
};
const rand = seededRand(20260401); // Seed = April 1, 2026
```

**Why seeded?** Every time the app loads, `generateMockBatches()` produces the **exact same 20 batches**. Without seeding, data would randomise on every page refresh, breaking filter expectations and making debugging unpredictable.

#### Building a single step with time chaining

```typescript
const buildStep = (stepName, startTime, minDuration, maxDuration, recordsProcessed, forceFailure) => {
  const duration  = randInt(minDuration, maxDuration);
  const completed = new Date(startTime.getTime() + duration * 1000);
  return { step_name: stepName, started_at: startTime, completed_at: completed, ... };
};

// Pipeline construction — currentTime cursor advances with each step
let currentTime = new Date(batchStart);
const edwFetch  = buildStep('EDW Fetch', currentTime, 30, 60, totalOrders, ...);
currentTime     = new Date(currentTime.getTime() + edwFetch.duration_seconds * 1000);
const pass1     = buildStep('Pass 1 Allocation', currentTime, 90, 150, ...);
// ... and so on for all 6 steps
```

The `currentTime` cursor advances by each step's duration, ensuring steps **never overlap** — they are always sequential, matching real-world pipeline behavior.

#### Generating 20 batches

```typescript
const baseDate = new Date(2026, 3, 1, 0, 0, 0); // April 1, 2026 00:00
for (let i = 0; i < 20; i++) {
  const batchStart = new Date(baseDate.getTime() + i * 2 * 60 * 60 * 1000); // +2h each
  const isFailed   = rand() < 0.1; // 10% failure probability
  batches.push(generateBatch(batchStart, isFailed));
}
return batches.sort((a, b) => b.started_at.getTime() - a.started_at.getTime()); // newest first
```

Batches span April 1 00:00 through April 2 14:00 (20 × 2h = 40 hours). The final sort puts newest first, matching expected table display order.

|--------|------|---------|
| `MOCK_BATCHES` | `BatchResult[]` | Sorted array (newest first) |
| `MOCK_BATCH_MAP` | `Record<string, BatchResult>` | O(1) lookup by `batch_id` |
| `BATCH_ID_SUGGESTIONS` | `string[]` | For FilterPanel Job ID autocomplete |

### 4.3 API Service — `src/services/batchApi.ts`

This is the **only layer** that touches data. Components and hooks never import `mockData.ts` directly — enabling a clean swap to a real API later.

#### Simulated network delay

```typescript
const SIMULATED_DELAY_MS = 600;
const delay = (ms: number): Promise<void> =>
  new Promise((resolve) => setTimeout(resolve, ms));
```

This 600ms delay makes loading skeletons visible during development, ensuring UI loading states are always exercised.

#### `fetchBatches` — the 4-stage filter + paginate pipeline

```typescript
export const fetchBatches = async (params): Promise<FetchBatchesResult> => {
  await delay(SIMULATED_DELAY_MS);
  let results = [...MOCK_BATCHES]; // Copy — never mutate source array

  // Stage 1: Filter by Job ID (case-insensitive partial match)
  if (filters.jobId.trim()) {
    const query = filters.jobId.trim().toUpperCase();
    results = results.filter((b) => b.batch_id.toUpperCase().includes(query));
  }

  // Stage 2: Filter by date (year/month/day comparison)
  if (filters.date) {
    const filterDate = parseDateString(filters.date);
    results = results.filter((b) =>
      b.started_at.getFullYear() === filterDate.getFullYear() &&
      b.started_at.getMonth()    === filterDate.getMonth()    &&
      b.started_at.getDate()     === filterDate.getDate()
    );
  }

  // Stage 3: Filter by time frame (uses isWithinTimeFrame from dateUtils.ts)
  if (filters.timeFrame !== 'all') {
    results = results.filter((b) =>
      isWithinTimeFrame(b.started_at, filters.timeFrame, {
        start: filters.customTimeStart, end: filters.customTimeEnd,
      })
    );
  }

  // Stage 4: Filter by status
  if (filters.status === 'success') results = results.filter((b) => b.success === true);
  else if (filters.status === 'failed') results = results.filter((b) => b.success === false);

  // Paginate AFTER filtering — total reflects post-filter count
  const total      = results.length;
  const startIndex = (page - 1) * pageSize;
  return { data: results.slice(startIndex, startIndex + pageSize), total, page, pageSize };
};
```

Each filter narrows `results` further. Pagination is applied **last** so `total` always reflects what was found, not a pre-filter count.

#### `fetchBatchById` — single batch lookup

```typescript

### 5.2 Filter Context — `src/contexts/FilterContext.tsx`

Filter state is **global** — `FilterPanel` writes it, `BatchListPage` reads it. Without a context, the state would need to live in a common ancestor and be prop-drilled through multiple layers.

#### Context value shape

```typescript
interface FilterContextValue {
  filters: FilterState;
  setFilters: (filters: FilterState) => void;              // Replace entire filter object
  updateFilter: (key, value) => void;                      // Update one field
  resetFilters: () => void;                                // Back to DEFAULT_FILTER_STATE
  hasActiveFilters: boolean;                               // Any non-default filter active?
  isLive: boolean;                                         // Future: WebSocket toggle
  setIsLive: (live: boolean) => void;
}
```

#### `hasActiveFilters` computed value

```typescript
const hasActiveFilters = useMemo(
  () =>
    filters.jobId     !== DEFAULT_FILTER_STATE.jobId     ||
    filters.date      !== DEFAULT_FILTER_STATE.date      ||
    filters.timeFrame !== DEFAULT_FILTER_STATE.timeFrame ||
    filters.status    !== DEFAULT_FILTER_STATE.status,
  [filters],
);
```

Drives the "active filters" badge without any imperative tracking. Adding a new filter field means adding one more `||` condition here.

#### How the context is consumed

- **`FilterPanel`** — calls `setFilters()` on Apply, `resetFilters()` on Clear
- **`BatchListPage`** — reads `filters` and passes to `useBatches()`
- **`useFilterContext()`** hook — throws a descriptive error if called outside `FilterProvider`

### 5.3 Custom Hooks

#### `useBatches` — `src/hooks/useBatches.ts`

```typescript
export const useBatches = ({ filters, page, pageSize = 10 }) => {
  const queryResult = useQuery({
    queryKey:  ['batches', filters, page, pageSize],  // Changes trigger re-fetch
    queryFn:   () => fetchBatches({ filters, page, pageSize }),
    staleTime: 30_000, // 30 seconds before considered stale
    retry: 2,
  });
  return {
    batches:    queryResult.data?.data ?? [],
    total:      queryResult.data?.total ?? 0,
    isLoading, isFetching, isError, error, refetch,
  };
};
```

`queryKey` is `['batches', filters, page, pageSize]`. React Query compares this key **deeply** on every render. When any filter or page changes, the key changes and React Query automatically re-runs `queryFn`. The caller never writes `useEffect` to trigger refetches.

`staleTime: 30_000` — the cached result stays fresh for 30 seconds. If the user changes filters and changes back, the original result is served from cache instantly (no spinner) for up to 30 seconds.

#### `useBatchDetails` — `src/hooks/useBatchDetails.ts`

```typescript
export const useBatchDetails = (batchId: string | undefined) => {
  const queryResult = useQuery({
    queryKey:  ['batch', batchId],
    queryFn:   () => batchId ? fetchBatchById(batchId) : Promise.resolve(null),
    enabled:   !!batchId,    // Query only fires when batchId is defined
    staleTime: 60_000,       // 1 minute — detail pages change less often
  });
  return {
    batch:    queryResult.data ?? null,
    notFound: queryResult.isSuccess && queryResult.data === null,
    ...
  };
};
```

`enabled: !!batchId` prevents the query from firing with `undefined` as the key. `notFound` is derived: `isSuccess` means fetch completed without error, but `data === null` means `fetchBatchById` returned null (ID not in map) — renders `EmptyState`.

#### `useWebSocket` — `src/hooks/useWebSocket.ts`

Skeleton hook for future live-mode real-time updates. Currently a no-op. When implemented, it will establish a WebSocket connection and push new batch data into the React Query cache via `queryClient.setQueryData()`. The `enabled` prop is `false` by default.

### 5.4 Utility Functions

#### `src/utils/dateUtils.ts`

| Function | Signature | What it does |
|----------|-----------|--------------|
| `formatDisplayDate` | `(date: Date) → string` | "Apr 01, 2026" |
| `formatDisplayTime` | `(date: Date) → string` | "14:00:00" (24h) |
| `formatDuration` | `(seconds: number) → string` | 125 → "2m 05s" |
| `parseDateString` | `(str: string) → Date` | Parses "YYYY-MM-DD" |
| `isWithinTimeFrame` | `(date, timeFrame, custom) → boolean` | Core filter logic |
| `isValidBatchIdFormat` | `(id: string) → boolean` | Validates "BATCH-YYYYMMDD-HHMM" |

**`isWithinTimeFrame` — the custom time filter engine:**

```typescript
export const isWithinTimeFrame = (date, timeFrame, custom): boolean => {
  const totalMinutes = date.getHours() * 60 + date.getMinutes();
  switch (timeFrame) {
    case 'morning':   return totalMinutes >= 0   && totalMinutes < 720;   // 00:00–12:00
    case 'afternoon': return totalMinutes >= 720  && totalMinutes <= 1439; // 12:00–23:59
    case 'custom': {
      const parseHHMM = (hhmm) => {
        const [h, m] = hhmm.split(':').map(Number);
        return isNaN(h) || isNaN(m) ? -1 : h * 60 + m;
      };
      const startMin = parseHHMM(custom.start); // "12:00" → 720
      const endMin   = parseHHMM(custom.end);   // "16:00" → 960
      if (startMin < 0 || endMin < 0) return true; // Incomplete range — show all
      return totalMinutes >= startMin && totalMinutes <= endMin;
    }
    default: return true;
  }
};
```

Everything converts to **minutes since midnight** for simple numeric comparisons. "12:00–16:00" becomes 720–960 minutes.

### `src/components/BatchList/CustomTimePicker.tsx`

Expandable panel with Start + End time pickers for `timeFrame === 'custom'`.

#### The critical design — uncontrolled TimeSlot

The original implementation used `useMemo` to derive `hour` and `minute` from the `value` prop. **The bug:**

1. User selects hour "12", minute not yet selected
2. `buildTimeString("12", "")` returns `""` (minute invalid)
3. Parent stores `customTimeStart = ""`
4. `value` prop becomes `""`
5. `useMemo` re-derives → `hour = ""` — **erasing the user's selection**
6. Filter never builds → always shows all results

**Fix:** `TimeSlot` uses `useState` initialized **once** from the prop:

```typescript
const TimeSlot = ({ label, initialValue, onChange, ... }) => {
  // Initialized ONCE — never re-derived from props after mount
  const [hour,   setHour]   = useState(() => initialValue.split(':')[0] ?? '');
  const [minute, setMinute] = useState(() => initialValue.split(':')[1] ?? '');

  const handleHourChange = useCallback((_: React.SyntheticEvent, newVal) => {
    const h = newVal ?? '';
    setHour(h);
    setMinute((prevMinute) => {            // Functional update — reads latest state
      onChange(buildTimeString(h, prevMinute)); // '' until minute also selected
      return prevMinute;
    });
  }, [onChange]);
};
```

The functional update `setMinute((prevMinute) => {...})` reads the latest minute from React state — avoiding the classic **stale closure trap** where `handleHourChange` would capture `minute` from the time of its last creation.

**Reset via key prop:** `customPickerResetKey` increment forces React to unmount + remount `TimeSlot`:

```typescript
<TimeSlot key={`start-${resetKey}`} ... />
<TimeSlot key={`end-${resetKey}`}   ... />
```

#### `buildTimeString` — combining hour + minute

```typescript
const buildTimeString = (hour: string, minute: string): string => {
  if (!isValidHour(hour) || !isValidMinute(minute)) return '';
  return `${String(parseInt(hour, 10)).padStart(2, '0')}:${String(parseInt(minute, 10)).padStart(2, '0')}`;
};
```

Returns `''` if either part is incomplete. The parent stores `''` until both parts are filled. The API treats `''` as "no time filter" — correct while the user is mid-entry.

## 9. Architectural & Design Decisions

### Decision 1 — React Query instead of useState + useEffect

**What:** All data fetching uses TanStack React Query.

**Why:** The manual pattern requires 20+ lines of boilerplate per fetch — loading state, error state, refetch trigger, cleanup. React Query collapses this to 5 lines and adds:
- Automatic caching (same key = shared fetch)
- Background refetching
- Retry logic (configurable)
- Request deduplication
- Stale-while-revalidate

None of these come with the manual `useEffect` pattern.

---

### Decision 2 — Filter state in React Context

**What:** `FilterState` lives in `FilterContext`, not the Page component or URL-only.

**Why:** `FilterPanel` (writer) and `BatchListPage` (reader) are siblings — not parent/child. Without context, state must live in their common ancestor and be prop-drilled through every intermediate layer. Context eliminates prop drilling. The URL is a side-effect for shareability.

---

### Decision 3 — Uncontrolled TimeSlot with key-based reset

**What:** `TimeSlot` manages own `useState` for hour/minute. Parent resets by changing `key`.

**Why:** Fully controlled components (where `value` prop drives display) caused a critical bug — partial entry got cleared by the round-trip through parent state. Uncontrolled with key-reset is the React-idiomatic solution for form fields that need persistent partial state during editing.

---

### Decision 4 — API layer as swap-point (Repository pattern)

**What:** All data access through `batchApi.ts`. Components never import `mockData.ts`.

**Why:** When the real OPRO API is available, only `batchApi.ts` changes. Every hook, component, and page remains untouched. This is the **Repository pattern** applied to frontend code.

---

### Decision 5 — TypeScript strict mode + centralised types

**What:** All interfaces in `src/types/batch.ts`. `"strict": true` in tsconfig.

**Why:** Strict mode catches null dereferences, implicit `any`, and missing returns at **compile time**, not runtime in production. Centralising types means one canonical `BatchResult` definition — rename a field and TypeScript reports every broken usage.

---

### Decision 6 — `React.memo` on `BatchRow`

**What:** `BatchRow` wrapped in `memo()`.

**Why:** The table can show 25 rows. A page change (state update in `BatchListPage`) would normally re-render all 25. With `memo`, only rows whose `batch` prop reference changed re-render. React Query returns stable references for unchanged data, so typically only new-page rows render.

---

### Decision 7 — Seeded random for mock data

**What:** LCG seeded with `20260401` in `mockData.ts`.

**Why:** `Math.random()` would produce different 20 batches on every page refresh — filter results would be unpredictable, making development and debugging unreliable. The seed guarantees identical batches every time.

---

### Decision 8 — Lazy page loading

**What:** `React.lazy()` for both page components.

**Why:** Without lazy loading, Vite bundles everything into one JS file. With it, `BatchDetailsPage` is only downloaded when a user clicks a row. For users who only use the list view, the detail page JS is **never downloaded**.

---

### Decision 9 — MUI global component overrides in theme

**What:** Table header styles defined in `ashleyTheme.ts` `components.MuiTableHead.styleOverrides`.

**Why:** One change in the theme updates every table in the app. Inline `sx` props on individual tables would require hunting down every instance when the brand changes.

---

### Decision 10 — Class component for ErrorBoundary

**What:** `ErrorBoundary` is a class component.

**Why:** React's error boundary lifecycle methods (`getDerivedStateFromError`, `componentDidCatch`) only work in class components. This is a React architectural constraint — functional components simply cannot implement error boundaries. It's the only class component in the entire codebase.

---

### Decision 11 — URL persistence with `replace: true`

**What:** `setSearchParams(params, { replace: true })`.

**Why:** Without `replace: true`, every filter change pushes a history entry. The Back button cycles through every intermediate filter state. `replace: true` keeps the history stack clean.

---

### Decision 12 — 1-based API, 0-based MUI pagination bridge

**What:** `fetchBatches` uses 1-based pages; MUI `TablePagination` uses 0-based. Conversion in `BatchTable.tsx`.

**Why:** REST APIs conventionally use `page=1` for the first page (human language). MUI follows zero-indexed JavaScript convention. The `+1 / -1` conversion is isolated to one function — both the API contract and the UI component stay idiomatic.

---

## 10. Package Reference

### Production dependencies

| Package | Version | Purpose |
|---------|---------|---------|
| `react` | 18.3+ | Core UI library. Concurrent features, automatic batching. Used everywhere. |
| `react-dom` | 18.3+ | DOM renderer. `createRoot` API in `main.tsx`. |
| `@mui/material` | 7.3+ | Every UI element: AppBar, Table, Chip, LinearProgress, Autocomplete, Select, Collapse, Skeleton, Snackbar, etc. |
| `@mui/icons-material` | 7.3+ | 2000+ SVG icon components. HistoryIcon, CheckCircleIcon, CancelIcon, ArrowForwardIcon, AccessTimeIcon, etc. |
| `@emotion/react` | 11.x | CSS-in-JS runtime required by MUI. Parses the `sx` prop at runtime. |
| `@emotion/styled` | 11.x | Styled component API. Required by MUI's internal styling. |
| `react-router-dom` | 7.x | Client-side routing. `BrowserRouter`, `Routes`, `Route`, `useNavigate`, `useParams`, `useSearchParams`. |
| `@tanstack/react-query` | 5.x | Server state. `QueryClient`, `useQuery`. Caching, loading states, retry, background refetch. |
| `axios` | 1.x | HTTP client. Wired in `batchApi.ts`, dormant (mock data used). Ready for real API via `axios.create`. |
| `date-fns` | 3.x | Date utilities. Tree-shakeable — only imported functions are bundled. Immutable, full TypeScript types. |

### Development dependencies

| Package | Version | Purpose |
|---------|---------|---------|
| `vite` | 5.x | Build tool. HMR dev server, ES module native, Rollup production builds. |
| `@vitejs/plugin-react` | 4.x | React Fast Refresh + JSX transform for Vite. |
| `typescript` | 5.x | Compiler. Strict mode configured in `tsconfig.app.json`. |

| `eslint` | 9.x | Static analysis. Catches JS/TS errors and enforces code style. |
| `typescript-eslint` | 8.x | TypeScript-aware ESLint rules. Type-checked linting. |

### Why these packages over alternatives

| Decision | Chosen | Alternative | Reason |
|----------|--------|-------------|--------|
| State management | React Query | Redux, Zustand | Purpose-built for server state. Redux needs sagas/thunks for async — heavy boilerplate for a read-mostly dashboard. |
| Component library | MUI v7 | Ant Design, Chakra UI | Most comprehensive data-display components + mature theming — critical for brand color enforcement. |
| Build tool | Vite | Create React App, Webpack | Native ES modules — dev startup under 300ms vs CRA's ~10s. Smaller bundles, less config. |
| Date library | date-fns | Moment.js, Day.js | Tree-shakeable (only used functions bundled). Moment.js adds ~67KB even if only `format` is used. |
| CSS approach | MUI sx + theme | CSS Modules, Tailwind | `sx` prop colocates styles with components, has full theme token access. Global overrides enforce brand consistency. |

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  /* ── Configure marked with syntax highlighting ── */
  marked.setOptions({
    gfm: true,
    breaks: false,
  });

  const renderer = new marked.Renderer();

  // Add IDs to headings for TOC linking
  renderer.heading = function (text, level) {
    const id = text.toLowerCase()
      .replace(/[`*]/g, '')
      .replace(/[^\w\s-]/g, '')
      .trim()
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
    return `<h${level} id="${id}">${text}</h${level}>`;
  };

  marked.use({ renderer });

  /* ── Render markdown ── */
  const mdSource = document.getElementById('md-src').value;
  document.getElementById('content').innerHTML = marked.parse(mdSource);

  /* ── Syntax highlight all code blocks ── */
  document.querySelectorAll('pre code').forEach((block) => {
    hljs.highlightElement(block);
  });

  /* ── Build sidebar TOC ── */
  const headings = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4');
  const tocContainer = document.getElementById('toc-links');

  headings.forEach((heading) => {
    const level = heading.tagName.toLowerCase();
    const text  = heading.textContent;
    const id    = heading.id;
    if (!id) return;

    const link = document.createElement('a');
    link.href      = '#' + id;
    link.className = 'toc-item ' + level;
    link.textContent = text;
    link.addEventListener('click', function (e) {
      e.preventDefault();
      document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    tocContainer.appendChild(link);

    // Section separator after h1
    if (level === 'h1') {
      const sep = document.createElement('div');
      sep.className = 'toc-section-sep';
      tocContainer.appendChild(sep);
    }
  });

  /* ── Active TOC item on scroll ── */
  const tocLinks  = document.querySelectorAll('.toc-item');
  const allHeadings = Array.from(headings);
  const progressBar = document.getElementById('progress-bar');
  const backTop     = document.getElementById('back-top');
  const mainEl      = document.getElementById('main');

  function onScroll() {
    const scrollTop    = window.scrollY;
    const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress     = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
    progressBar.style.width = progress + '%';

    // Back to top button
    if (scrollTop > 400) backTop.classList.add('visible');
    else backTop.classList.remove('visible');

    // Active TOC item
    let current = '';
    for (const h of allHeadings) {
      const rect = h.getBoundingClientRect();
      if (rect.top <= 90) current = h.id;
    }
    tocLinks.forEach((link) => {
      link.classList.toggle('active', link.getAttribute('href') === '#' + current);
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* ── Auto-scroll active TOC item into view in sidebar ── */
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        const id   = entry.target.id;
        const link = tocContainer.querySelector(`a[href="#${id}"]`);
        if (link) link.scrollIntoView({ block: 'nearest' });
      }
    });
  }, { rootMargin: '-10% 0px -80% 0px' });

  allHeadings.forEach((h) => observer.observe(h));
})();
</script>
